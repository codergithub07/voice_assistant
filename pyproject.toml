[project]
name = "jarvis"
version = "0.1.0"
description = "Offline-first desktop voice assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "gtts>=2.5.4",
    "huggingface-hub>=0.33.0",
    "joblib>=1.5.1",
    "lxml>=6.0.2",
    "nltk>=3.9.1",
    "num2words>=0.5.14",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pyttsx3>=2.98",
    "requests>=2.32.4",
    "scikit-learn>=1.7.0",
    "sounddevice>=0.5.2",
    "speechrecognition>=3.14.3",
    "torch>=2.7.1",
    "transformers>=4.52.4",
    "vosk>=0.3.45",
    "webrtcvad>=2.0.10",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
jarvis = "main:main"
